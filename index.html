      property="og:description"
      content="GradeWise helps students convert CGPA, SGPA, marks and grades accurately using verified, university-specific academic rules across India."

    <script>
      // Applied before first paint to avoid a light/dark flash-of-incorrect-theme.
      ;(function () {
        try {
          var pref = localStorage.getItem('gradewise-theme')
          if (pref === 'light' || pref === 'dark') {
            document.documentElement.setAttribute('data-theme', pref)
          }
        } catch (e) {}
      })()
    </script>
    <script>
      // GitHub Pages SPA deep-link support: decodes a path that 404.html
      // redirected here as a query string, restoring the original URL via history.
      ;(function () {
        var redirect = sessionStorage.getItem('gw-redirect')
        if (redirect) {
          sessionStorage.removeItem('gw-redirect')
          if (redirect !== location.pathname + location.search + location.hash) {
            history.replaceState(null, '', redirect)
          }
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
